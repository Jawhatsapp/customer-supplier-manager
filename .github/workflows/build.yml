name: Build Flutter APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create env file
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env
      - name: Recreate android folder
        run: |
          rm -rf android
          flutter create --platforms=android .
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Force compileSdk for plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            F=android/build.gradle.kts
            printf '%s\n' 'subprojects { afterEvaluate { extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) } } }' > /tmp/hook
          else
            F=android/build.gradle
            printf '%s\n' 'subprojects { afterEvaluate { p -> if (p.hasProperty("android")) { p.android { compileSdkVersion 36 } } } }' > /tmp/hook
          fi
          cat /tmp/hook "$F" > /tmp/new
          cp /tmp/new "$F"
          head -3 "$F"
      - name: Fix code for new Flutter
        run: |
          find lib -name '*.dart' -exec sed -i 's/CardTheme(/CardThemeData(/g; s/const ListToCsvConverter(/ListToCsvConverter(/g' {} +
      - name: Fix packages
        run: |
          flutter pub add csv:^6.0.0
          flutter pub add 'override:sign_in_with_apple:^6.1.0' || flutter pub add 'override:sign_in_with_apple:^7.0.1'
          flutter pub upgrade
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
