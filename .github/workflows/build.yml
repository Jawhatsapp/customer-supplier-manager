name: Build and Update
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'setup = تجهيز أول مرة | release = نسخة APK كاملة | patch = تحديث مباشر'
        required: true
        default: patch
        type: choice
        options:
          - setup
          - release
          - patch

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Flutter (setup only)
        if: ${{ inputs.action == 'setup' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Create env file
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env
          echo "mobile_app/.env" >> ../.git/info/exclude

      # ---------------- setup: مرة واحدة فقط ----------------
      - name: Prepare project
        if: ${{ inputs.action == 'setup' }}
        run: |
          rm -rf android
          flutter create --platforms=android .
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          if [ -f android/build.gradle.kts ]; then
            F=android/build.gradle.kts
            printf '%s\n' 'subprojects { afterEvaluate { extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) } } }' > /tmp/hook
          else
            F=android/build.gradle
            printf '%s\n' 'subprojects { afterEvaluate { p -> if (p.hasProperty("android")) { p.android { compileSdkVersion 36 } } } }' > /tmp/hook
          fi
          cat /tmp/hook "$F" > /tmp/new
          cp /tmp/new "$F"
          find lib -name '*.dart' -exec sed -i 's/CardTheme(/CardThemeData(/g; s/const ListToCsvConverter(/ListToCsvConverter(/g' {} +
          flutter pub add csv:^6.0.0
          flutter pub add 'override:sign_in_with_apple:^6.1.0' || flutter pub add 'override:sign_in_with_apple:^7.0.1'
          flutter pub upgrade
          [ -f shorebird.yaml ] || shorebird init

      - name: Commit prepared project
        if: ${{ inputs.action == 'setup' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mobile_app
          git commit -m "Prepare project for Shorebird" || echo "nothing to commit"
          git push

      # ---------------- release: نسخة كاملة تُثبَّت مرة ----------------
      - name: Shorebird release
        if: ${{ inputs.action == 'release' }}
        run: |
          shorebird release android --artifact apk --flutter-version=${{ env.FLUTTER_VERSION }} -- --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Upload APK
        if: ${{ inputs.action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      # ---------------- patch: تحديث مباشر بدون تثبيت ----------------
      - name: Shorebird patch
        if: ${{ inputs.action == 'patch' }}
        run: shorebird patch android --release-version=latest
